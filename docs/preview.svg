    <text x="750" y="235" text-anchor="middle" font-size="8" fill="#94a3b8">智数</text>
    <text x="630" y="215" text-anchor="middle" font-size="9" font-weight="600" fill="#ef4444">120h</text>
    <text x="690" y="183" text-anchor="middle" font-size="9" font-weight="600" fill="#f59e0b">48h</text>
