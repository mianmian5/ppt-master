# PPT Master 配置文件
# 放在项目目录下，自定义行为

# ============================================================
# 演示基本信息
# ============================================================
presentation:
  title: ""                     # PPT 标题
  author: ""                    # 演讲人
  company: ""                   # 公司/团队
  subtitle: ""                  # 副标题/标语

# ============================================================
# 配色方案
# ============================================================
# 预设可选: blue | red | green | purple | orange | dark | teal
color_scheme: "blue"

# ============================================================
# 报告类型
# ============================================================
# 可选: pitch (路演) | product_launch (产品发布) | work_report (工作汇报)
#       | annual_summary (年终总结) | company_intro (企业介绍)
presentation_type: "pitch"

# ============================================================
# 生成参数
# ============================================================
generation:
  target_pages: 12              # 目标页数
  language: "zh"                # zh | en | bilingual
  aspect_ratio: "16x9"          # 16x9 | 4x3
  include_charts: true          # 是否包含图表
  include_table: true           # 是否包含表格

# ============================================================
# 品牌元素
# ============================================================
branding:
  logo: ""                      # Logo 图片路径（留空则不添加）
  logo_position: "top-right"    # top-left | top-right | bottom-right
  font_name: "Microsoft YaHei"  # 中文字体名
