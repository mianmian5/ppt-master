    <rect x="45" y="80" width="220" height="3" rx="1.5" fill="#3b82f6"/>
    <text x="155" y="115" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">AI 数据分析平台</text>
    <text x="155" y="138" text-anchor="middle" font-size="10" fill="#93bbfd">让数据说话 · 让决策更准</text>
    <text x="155" y="220" text-anchor="middle" font-size="9" fill="#5a78a8">智数科技 · 张三</text>
  </g>
  <text x="155" y="258" text-anchor="middle" font-size="10" fill="#94a3b8">封面 Cover</text>
  <!-- Two column slide -->
