<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="blueg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="greeng" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="orangeg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="320" rx="16" fill="#f8fafc"/>
  <text x="450" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">PPT Master — 工作流程</text>
  <!-- Step 1 -->
  <rect x="30" y="55" width="160" height="100" rx="14" fill="url(#blueg)" filter="url(#shadow)"/>
  <text x="110" y="95" text-anchor="middle" font-size="28" fill="#fff" opacity="0.3">1</text>
  <text x="110" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">📝 输入需求</text>
  <text x="110" y="125" text-anchor="middle" font-size="11" fill="#bfdbfe">说出 PPT 主题/场景/页数</text>
  <!-- Arrow 1 -->
  <line x1="190" y1="105" x2="225" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 2 -->
  <rect x="230" y="55" width="160" height="100" rx="14" fill="url(#greeng)" filter="url(#shadow)"/>
  <text x="310" y="95" text-anchor="middle" font-size="28" fill="#fff" opacity="0.3">2</text>
  <text x="310" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">📋 大纲确认</text>
  <text x="310" y="125" text-anchor="middle" font-size="11" fill="#bbf7d0">AI 提出结构 → 用户确认</text>
  <!-- Arrow 2 -->
  <line x1="390" y1="105" x2="425" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 3 -->
  <rect x="430" y="55" width="160" height="100" rx="14" fill="url(#orangeg)" filter="url(#shadow)"/>
  <text x="510" y="95" text-anchor="middle" font-size="28" fill="#fff" opacity="0.3">3</text>
  <text x="510" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">⚡ 自动生成</text>
  <text x="510" y="125" text-anchor="middle" font-size="11" fill="#fef3c7">python-pptx 逐页渲染</text>
  <!-- Arrow 3 -->
  <line x1="590" y1="105" x2="625" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Step 4 -->
  <rect x="630" y="55" width="160" height="100" rx="14" fill="url(#purpg)" filter="url(#shadow)"/>
  <text x="710" y="95" text-anchor="middle" font-size="28" fill="#fff" opacity="0.3">4</text>
  <text x="710" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">🎯 PPTX 输出</text>
  <text x="710" y="125" text-anchor="middle" font-size="11" fill="#e9d5ff">双击即可打开编辑</text>
  <!-- Bottom info -->
  <rect x="50" y="185" width="800" height="110" rx="12" fill="#f1f5f9"/>
  <text x="450" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">支持的 PPT 场景</text>
  <rect x="70" y="225" width="115" height="28" rx="8" fill="#dbeafe"/><text x="127" y="244" text-anchor="middle" font-size="11" fill="#2563eb">💼 商业路演</text>
  <rect x="200" y="225" width="115" height="28" rx="8" fill="#dcfce7"/><text x="257" y="244" text-anchor="middle" font-size="11" fill="#16a34a">🚀 产品发布</text>
  <rect x="330" y="225" width="115" height="28" rx="8" fill="#fef3c7"/><text x="387" y="244" text-anchor="middle" font-size="11" fill="#d97706">📊 工作汇报</text>
  <rect x="460" y="225" width="115" height="28" rx="8" fill="#f3e8ff"/><text x="517" y="244" text-anchor="middle" font-size="11" fill="#9333ea">📈 数据分析</text>
  <rect x="590" y="225" width="115" height="28" rx="8" fill="#fce7f3"/><text x="647" y="244" text-anchor="middle" font-size="11" fill="#db2777">🏢 企业介绍</text>
  <text x="450" y="285" text-anchor="middle" font-size="11" fill="#94a3b8">12 种版式 · 8 种配色 · 无需 PowerPoint</text>
</svg>
