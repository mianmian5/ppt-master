    <text x="360" y="105" text-anchor="middle" font-size="10" font-weight="600" fill="#ef4444">传统方案</text>
    <text x="500" y="105" text-anchor="middle" font-size="10" font-weight="600" fill="#22c55e">AI 智能平台</text>
    <text x="340" y="125" font-size="9" fill="#64748b">✗ 人工数据导出</text>
    <text x="480" y="125" font-size="9" fill="#64748b">✓ 自动数据接入</text>
    <text x="340" y="142" font-size="9" fill="#64748b">✗ Excel 手工分析</text>
