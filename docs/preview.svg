<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="s">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000015"/>
    </filter>
  </defs>
  <rect width="860" height="480" rx="16" fill="#f8fafc"/>
  <text x="430" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">生成的 PPT 预览示例</text>
  <!-- Cover slide -->
  <g filter="url(#s)">
    <rect x="25" y="45" width="260" height="195" rx="8" fill="#1e3a5f"/>
