    <text x="685" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#3b82f6">Q2</text>
    <text x="745" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#3b82f6">Q3</text>
    <text x="805" y="340" text-anchor="middle" font-size="8" font-weight="600" fill="#3b82f6">Q4</text>
    <text x="625" y="395" text-anchor="middle" font-size="8" fill="#64748b">MVP</text>
    <text x="685" y="395" text-anchor="middle" font-size="8" fill="#64748b">AI 引擎</text>
    <text x="745" y="395" text-anchor="middle" font-size="8" fill="#64748b">企业版</text>
    <text x="805" y="395" text-anchor="middle" font-size="8" fill="#64748b">国际化</text>
