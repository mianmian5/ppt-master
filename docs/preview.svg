    <text x="387" y="354" font-size="8" fill="#22c55e">✓</text>
    <text x="437" y="354" font-size="8" fill="#22c55e">✓</text>
    <text x="487" y="354" font-size="8" fill="#ef4444">✗</text>
    <text x="320" y="369" font-size="8" fill="#64748b">AI 分析</text>
    <text x="387" y="369" font-size="8" fill="#22c55e">✓</text>
    <text x="437" y="369" font-size="8" fill="#ef4444">✗</text>
    <text x="487" y="369" font-size="8" fill="#ef4444">✗</text>
    <text x="320" y="384" font-size="8" fill="#64748b">仪表盘</text>
    <text x="387" y="384" font-size="8" fill="#22c55e">✓</text>
    <text x="437" y="384" font-size="8" fill="#22c55e">✓</text>
    <text x="487" y="384" font-size="8" fill="#22c55e">✓</text>
    <text x="320" y="399" font-size="8" fill="#64748b">报表</text>
    <text x="387" y="399" font-size="8" fill="#22c55e">✓</text>
    <text x="437" y="399" font-size="8" fill="#ef4444">✗</text>
    <text x="487" y="399" font-size="8" fill="#ef4444">✗</text>
    <text x="320" y="414" font-size="8" fill="#64748b">开放接口</text>
    <text x="387" y="414" font-size="8" fill="#22c55e">✓</text>
    <text x="437" y="414" font-size="8" fill="#22c55e">✓</text>
    <text x="487" y="414" font-size="8" fill="#ef4444">✗</text>
    <text x="320" y="429" font-size="8" fill="#64748b">私有化</text>
    <text x="387" y="429" font-size="8" fill="#22c55e">✓</text>
    <text x="437" y="429" font-size="8" fill="#ef4444">✗</text>
    <text x="487" y="429" font-size="8" fill="#ef4444">✗</text>
  </g>
  <text x="430" y="483" text-anchor="middle" font-size="10" fill="#94a3b8">数据表格 Data Table</text>
  <!-- Timeline slide -->
  <g filter="url(#s)">
    <rect x="575" y="280" width="260" height="185" rx="8" fill="#fff"/>
    <rect x="575" y="280" width="260" height="35" rx="8" fill="#f8fafc"/>
