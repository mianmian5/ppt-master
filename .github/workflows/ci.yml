name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt
    - name: Generate sample PPTX
      run: |
        python3 scripts/generate.py examples/product-launch/outline.json /tmp/test-out.pptx
        python3 -c "
        from pptx import Presentation
        p = Presentation('/tmp/test-out.pptx')
        print(f'✅ PPTX 生成成功, 共 {len(p.slides)} 页')
        "
